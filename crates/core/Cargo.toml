[package]
name = "oc-sidememory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Transactional semantic constraints for structured token generation"
keywords = ["llm", "json-schema", "decoding", "parser", "inference"]
categories = ["parsing", "text-processing", "development-tools"]
include = [
    "src/**",
    "benches/**",
    "tests/**",
    "NOTICE",
    "PROVENANCE.md",
    "MODIFICATIONS.md",
]

[dependencies]
bincode.workspace = true
bitflags.workspace = true
once_cell.workspace = true
regex.workspace = true
regex-automata.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde-json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
hf-hub = { version = "=0.4.1", features = ["ureq", "rustls-tls"], default-features = false, optional = true }

[features]
default = ["huggingface-hub"]
huggingface-hub = ["hf-hub", "tokenizers/http", "tokenizers/rustls-tls"]
hugginface-hub = ["huggingface-hub"]

[lib]
name = "oc_sidememory"

[lints]
workspace = true

[[bench]]
name = "semantic_masks"
harness = false

[[bench]]
name = "semantic_transitions"
harness = false

[[bench]]
name = "semantic_memory"
harness = false
