# Portions derived from outlines-core and modified by OC-Sidememory contributors.
# See PROVENANCE.md and MODIFICATIONS.md.
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oc-sidememory"
authors = [{name = "OC-Sidememory contributors"}]
description = "Transactional semantic constraints for structured token generation"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords=[
    "machine learning",
    "deep learning",
    "language models",
    "structured generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.optional-dependencies]
# TODO: remove when numba is supported on the free-threaded build
test-without-numba = [
    "pre-commit",
    "pydantic",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-mock",
    "coverage[toml]>=5.1",
    "diff-cover",
    "numpy",
    "torch",
    "scipy",
    "asv",
    "psutil",
    "maturin[patchelf]",
]

test = [
    "oc-sidememory[test-without-numba]",
    "numba",
]

[project.urls]
homepage = "https://github.com/dhanavanthesh/oc-sidememory"
documentation = "https://github.com/dhanavanthesh/oc-sidememory/tree/main/docs"
repository = "https://github.com/dhanavanthesh/oc-sidememory"
issues = "https://github.com/dhanavanthesh/oc-sidememory/issues"
changelog = "https://github.com/dhanavanthesh/oc-sidememory/blob/main/CHANGELOG.md"

[project.readme]
file="README.md"
content-type = "text/markdown"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
addopts = [
    "--import-mode=importlib"
]
# provided by pytest-run-parallel but added here because
# pytest-run-parallel isn't a required test dependency
markers = [
    "thread_unsafe: Mark a test as thread-unsafe under pytest-run-parallel",
]

ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "tests/*",
]
branch = true
relative_files = true

[tool.coverage.report]
omit = [
    "tests/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true

[tool.diff_cover]
compare_branch = "origin/main"
diff_range_notation = ".."

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "."
module-name = "oc_sidememory._native"
features = ["python-bindings"]
