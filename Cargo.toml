[workspace]
resolver = "2"
members = ["crates/core", "crates/python", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/dhanavanthesh/oc-sidememory"
homepage = "https://github.com/dhanavanthesh/oc-sidememory"
documentation = "https://docs.rs/oc-sidememory"
readme = "README.md"

[workspace.dependencies]
bincode = "2.0.1"
bitflags = "2.9"
once_cell = "1.20"
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1.10.6"
regex-automata = "0.4.9"
rustc-hash = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde-json = { package = "serde_json", version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
serde-pyobject = "0.8.0"
thiserror = "2.0"
tokenizers = { version = "0.22.2", features = ["onig"], default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
